  soja: {nom: Soja et dérivés, parents: [legumineuses], natures: [], tags: [soja, soja_condiment], aliments: []}
  fruits_a_coque: {nom: Fruits à coque et dérivés, parents: [], natures: [], tags: [], aliments: [noix]}
