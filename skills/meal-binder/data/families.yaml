# Groupes culinaires, pas une classification médicale ni une garantie d'allergènes.
# Un produit local peut ajouter famille:<id> à ses tags ; les parents sont hérités.
familles:
  produits_animaux: {nom: Produits animaux, parents: [], natures: [], tags: [], aliments: []}
  poissons: {nom: Poissons et dérivés, parents: [produits_animaux], natures: [poisson], tags: [], aliments: []}
  viandes: {nom: Viandes et dérivés, parents: [produits_animaux], natures: [viande], tags: [], aliments: []}
  produits_laitiers: {nom: Produits laitiers, parents: [produits_animaux], natures: [laitier], tags: [], aliments: []}
